[project]
name = "morsoul-backend"
version = "0.1.0"
description = "Morsoul: World's Case cloud backend (accounts, cloud saves, updates, statistics)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymongo>=4.13",
    "bcrypt>=4.1",
    "cryptography>=42",
    "httpx>=0.27",
    "sqlcipher3-wheels>=0.5",
    "keyring>=25",
    "watchdog>=4",
    "platformdirs>=4",
    "aiohttp>=3.9",
    "pytest-qt>=4.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["morsoul_core", "morsoul_server", "morsoul_launcher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]   # B008: FastAPI uses Depends(...) in defaults on purpose; E501: the formatter handles line length

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
